<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VeloxGrab 下载监视</title>
<link rel="stylesheet" href="styles.css" />
<script src="theme.js"></script>
</head>
<body class="monitor-body">
  <!-- 下载监视框：无框小方窗，置顶悬浮。整体可拖动，速度/进度轮流显示。 -->
  <div class="monitor" data-tauri-drag-region>
    <div class="m-top" data-tauri-drag-region>
      <span class="m-name" id="mName" data-tauri-drag-region>待机</span>
      <button class="m-close" id="pwClose" title="关闭">×</button>
    </div>
    <div class="m-value" id="mValue" data-tauri-drag-region>—</div>
    <div class="m-sub" id="mSub" data-tauri-drag-region></div>
    <div class="m-bar"><div class="m-fill" id="mFill"></div></div>
  </div>
  <script src="progress.js"></script>
</body>
</html>
