<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VeloxGrab 下载监视</title>
<link rel="stylesheet" href="styles.css" />
<script src="theme.js"></script>
</head>
<body class="monitor-body">
  <!-- 下载监视框：逐任务列表（对齐 GD3 的扩展监视面板）。
       每个活跃任务一行：名称 + 状态 + 进度条 + 速度 + 行内操作。
       标题栏整条可拖；右下角有缩放手柄（resizable 窗口）。 -->
  <div class="monitor" id="monitor">
    <header class="m-head" id="mHead" data-tauri-drag-region>
      <span class="m-dot" id="mDot" aria-hidden="true"></span>
      <span class="m-title" id="mTitle" data-tauri-drag-region>待机</span>
      <span class="m-agg" id="mAgg" data-tauri-drag-region></span>
      <button class="m-close" id="pwClose" title="关闭监视窗">×</button>
    </header>

    <div class="m-list" id="mList" role="list"></div>

    <div class="m-empty" id="mEmpty">暂无进行中的下载</div>

    <footer class="m-foot hidden" id="mFoot">
      <span id="mFootText"></span>
    </footer>
  </div>
  <div class="m-resize" id="mResize" title="拖动调整大小"></div>
  <script src="progress.js"></script>
</body>
</html>
