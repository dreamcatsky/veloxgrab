<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>VeloxGrab</title>
<style>
  body { width: 340px; margin: 0; padding: 12px; font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { margin-bottom: 8px; }
  label { display: block; color: #666; margin-bottom: 2px; font-size: 12px; }
  input, select { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  .media { max-height: 140px; overflow: auto; border: 1px solid #eee; border-radius: 4px; padding: 4px; margin-bottom: 8px; }
  .media div { padding: 3px 4px; border-radius: 3px; cursor: pointer; word-break: break-all; }
  .media div:hover { background: #f0f4ff; }
  .dim { color: #999; }
  .chk { display: flex; align-items: center; gap: 6px; color: #333; font-size: 12.5px; }
  .chk input { width: auto; margin: 0; }
  button { width: 100%; padding: 7px; border: 0; border-radius: 4px; background: #4a7dff; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { background: #aab; cursor: default; }
  #msg { margin-top: 8px; color: #0a7; min-height: 1.2em; }
  #msg.err { color: #d33; }

  /* ---- 任务监视面板（对齐 GD3 插件的监视列表） ---- */
  #tasksWrap { margin-bottom: 10px; }
  #taskList { max-height: 190px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
  .tk { padding: 6px 8px; border-bottom: 1px solid #f2f2f2; }
  .tk:last-child { border-bottom: 0; }
  .tk-r1 { display: flex; align-items: center; gap: 6px; }
  .tk-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 12.5px; color: #222; }
  .tk-badge { flex: 0 0 auto; font-size: 10px; line-height: 1; padding: 3px 6px; border-radius: 99px; background: #eef; color: #667; white-space: nowrap; }
  .tk-badge.downloading { background: #e5efff; color: #2f6bd8; }
  .tk-badge.merging { background: #f1e8ff; color: #7a3fd1; }
  .tk-badge.done { background: #e6f4e6; color: #2f7a2f; }
  .tk-badge.failed { background: #fdeaea; color: #c33; }
  .tk-btn { width: auto; padding: 2px 7px; font-size: 11px; background: #f2f4f8; color: #456; border-radius: 4px; flex: 0 0 auto; }
  .tk-btn:hover { background: #e3e9f5; color: #234; }
  .tk-btn:disabled { opacity: .5; }
  .tk-bar { height: 4px; border-radius: 99px; background: #e8ecf4; overflow: hidden; margin-top: 5px; }
  .tk-fill { height: 100%; width: 0; border-radius: 99px; background: #4a7dff; transition: width .3s; }
  .tk.done .tk-fill { background: #4a9e4a; }
  .tk.failed .tk-fill { background: #d55; }
  .tk-r2 { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: #889; }
  .tk-meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tk-pct { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .tk-err { color: #c33; }
  .tk-empty { padding: 12px 8px; text-align: center; color: #999; font-size: 12px; }
</style>
</head>
<body>
  <h1>用 VeloxGrab 下载</h1>

  <!-- 任务监视面板：桌面端正在进行的下载，实时刷新，可暂停/继续 -->
  <div class="row" id="tasksWrap">
    <label>下载任务 <span class="dim" id="taskAgg"></span></label>
    <div id="taskList"><div class="tk-empty">加载中…</div></div>
  </div>

  <div class="row">
    <label>当前页面链接</label>
    <input id="url" type="text" spellcheck="false" />
  </div>

  <div class="row" id="mediaWrap" style="display:none">
    <label>页面里的媒体 <span class="dim">（点一条直接发送）</span></label>
    <div id="mediaList" class="media"></div>
  </div>

  <div class="row" id="sniffWrap" style="display:none">
    <label>嗅探到的流媒体 <span class="dim">（HLS / DASH 清单，点一条直接发送）</span></label>
    <div id="sniffList" class="media"></div>
  </div>

  <div class="row">
    <label class="chk"><input id="intercept" type="checkbox" checked /> 接管浏览器下载（点下载链接自动转给 VeloxGrab）</label>
  </div>
  <div class="row">
    <label class="chk"><input id="sniff" type="checkbox" checked /> 嗅探页面里的流媒体（m3u8 / mpd）</label>
  </div>
  <div class="row">
    <label class="chk"><input id="floatBtn" type="checkbox" checked /> 视频旁显示悬浮下载按钮</label>
  </div>
  <div class="row">
    <label class="chk"><input id="autoOpen" type="checkbox" checked /> 发送任务后自动弹出监视面板</label>
  </div>

  <div class="row">
    <label>保存目录 <span class="dim">（留空 = VeloxGrab 默认目录）</span></label>
    <input id="dir" type="text" spellcheck="false" placeholder="D:\Downloads" />
  </div>

  <div class="row">
    <label>线程数</label>
    <select id="threads">
      <option>1</option><option>2</option><option selected>4</option>
      <option>8</option><option>16</option><option>32</option>
    </select>
  </div>

  <button id="send">发送给 VeloxGrab</button>
  <div id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
