name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 只读权限：本工作流不发布任何东西，拿最小权限。
permissions:
  contents: read

jobs:
  rust:
    name: Rust tests & clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 与发布环境一致：本程序只发 Windows 版本，很多行为（路径语义、
      # FlushFileBuffers、taskkill）在别的平台上测不出真实结果。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # tauri 的构建脚本会校验 `bundle.resources` 里声明的文件是否存在，
      # 而 `src-tauri/bin/` 是 .gitignore 的本地依赖（发布构建时才下载
      # yt-dlp）。CI 里没有它，cargo test 会直接死在 build script：
      #   resource path `bin\yt-dlp.exe` doesn't exist
      # 测试不会执行这个二进制，放一个空占位即可。
      - name: Stub yt-dlp resource
        shell: pwsh
        working-directory: src-tauri
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Set-Content -Path bin/yt-dlp.exe -Value "" -NoNewline

      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib

      # 先只有测试能过还不够：clippy 的 lint 是「以后才会出问题」的代码
      # 味道，放行一次就会长期烂在那里，所以直接 -D warnings。
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  js:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 前端零构建、零依赖：没有 bundler 能在编译期抓语法错误，
      # 这里用 node --check 把「改坏一个括号」挡在合并之前。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node --check
        run: |
          node --check src/app.js
          node --check src/progress.js
          node --check src/theme.js
          node --check extension/background.js
          node --check extension/popup.js
          node --check make-icon.js
          node --check scripts/check-consistency.mjs

      # 版本号（4 处）与桥端口（2 处）分散在手工维护的文件里，漏改一处
      # 就是「扩展版本 ≠ 桌面版本」的 403 或扩展连错端口。合并前挡住。
      - name: Cross-file consistency
        run: node scripts/check-consistency.mjs
