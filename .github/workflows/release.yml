name: Release

# tag 推送触发：构建 NSIS 安装包 →（可选）SignPath 签名 → 创建**草稿**
# Release 并上传全量资产 → 生成 hdiff 增量补丁一并上传。
#
# 发布是**草稿**：资产全自动，但发布说明沿用手写惯例（历版 Release 的
# 变更清单都是精心写的），人工过目后点发布，「Latest」才对外生效。
#
# 签名在未配置 secrets 时整段跳过（产物未签名，SmartScreen 会警告）；
# 申请与配置步骤见 docs/signpath.md。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  # 随安装包发布的 yt-dlp 版本。升级时改这里，并保持本机
  # src-tauri/bin/yt-dlp.exe 同步（README「第三方组件」一节）。
  YT_DLP_VERSION: "2026.08.19"

jobs:
  build:
    name: Build & publish installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 发布构建要打**真的** yt-dlp 进安装包（测试用空占位，见 ci.yml）。
      # runner 走 Azure 网络，Invoke-WebRequest 无吊销检查问题。
      # hpatchz（增量更新的应用工具）同理，版本钉死在 make-patch.mjs。
      - name: Fetch bundled tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/${{ env.YT_DLP_VERSION }}/yt-dlp.exe" -OutFile src-tauri/bin/yt-dlp.exe
          $zip = Join-Path $env:TEMP "hdiffpatch.zip"
          gh release download v5.1.3 --repo sisong/HDiffPatch --pattern "hdiffpatch_v5.1.3_bin_windows64.zip" --output $zip --clobber
          $tmp = Join-Path $env:TEMP "hdp"
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          # zip 里 exe 在顶层子目录下，递归取 hpatchz 平铺进 bin/
          Get-ChildItem $tmp -Recurse -Filter hpatchz.exe | Copy-Item -Destination src-tauri/bin -Force
          Remove-Item $tmp -Recurse -Force; Remove-Item $zip -Force

      - name: Build NSIS installer
        run: |
          npm ci
          npm run build:nsis

      # ---- 代码签名（可选）----
      # SignPath 的 Trusted Build System for GitHub：把未签名安装包作为
      # workflow artifact 提交，SignPath 从同一个 commit 原始构建上下文
      # 出签名（Pipeline Integrity），签名产物回到 output 目录。
      - name: Detect SignPath configuration
        id: signpath
        shell: pwsh
        env:
          SP_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SP_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SP_PROJECT: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        run: |
          $on = ($env:SP_TOKEN -and $env:SP_ORG -and $env:SP_PROJECT)
          "enabled=$(if ($on) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer
        id: unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          retention-days: 1

      - name: Submit signing request (SignPath)
        if: steps.signpath.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Restore signed installer
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter *_x64-setup.exe | Select-Object -First 1
          if (-not $signed) { throw "签名产物里没有安装包" }
          Copy-Item $signed.FullName ("src-tauri/target/release/bundle/nsis/" + $signed.Name) -Force
          Write-Output "已替换为签名版：$($signed.Name)"

      # ---- 发布 ----
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *_x64-setup.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" "$($setup.FullName)" `
            --title "VeloxGrab ${{ github.ref_name }}" --draft --generate-notes

      # 增量补丁：对比上一个**已发布** release 的安装包，生成 .hdiff 与
      # 裸 exe（更新器的产物校验摘要来源）。补丁对象是安装包里的
      # veloxgrab.exe——SignPath 只签名安装包文件本身，payload 字节不变，
      # 所以 target/release 的裸 exe 与已发布安装包里装出来的一致。
      - name: Generate incremental patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/make-patch.mjs --upload
